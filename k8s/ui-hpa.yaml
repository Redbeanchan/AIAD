apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bgbye-ui-hpa
  namespace: bgbye
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bgbye-ui   
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
