<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIAD – Background Remover</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    input[type="file"] { margin-bottom: 1rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; background: #333; color: #fff; border: none; border-radius: 4px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .result { margin-top: 1.5rem; }
    .result img { max-width: 100%; border: 1px solid #ddd; border-radius: 4px; }
    .error { color: #c00; margin-top: 0.5rem; }
    .loading { color: #666; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>AIAD – Background Remover</h1>
  <p>Upload an image to remove the background (uses rembg isnet-general-use).</p>

  <label for="image">Image</label>
  <input type="file" id="image" accept="image/*" />

  <br />
  <button type="button" id="submit" disabled>Remove background</button>

  <div id="status" class="loading" aria-live="polite"></div>
  <div id="result" class="result"></div>

  <script>
    const API_BASE = "http://localhost:8000";

    const fileInput = document.getElementById("image");
    const submitBtn = document.getElementById("submit");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    fileInput.addEventListener("change", function () {
      submitBtn.disabled = !this.files || this.files.length === 0;
      resultEl.innerHTML = "";
      statusEl.textContent = "";
    });

    submitBtn.addEventListener("click", async function () {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      submitBtn.disabled = true;
      statusEl.textContent = "Processing…";
      statusEl.className = "loading";
      resultEl.innerHTML = "";

      const form = new FormData();
      form.append("file", file);

      try {
        const res = await fetch(API_BASE + "/remove-background", {
          method: "POST",
          body: form,
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(err || "Request failed");
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        resultEl.innerHTML = '<img src="' + url + '" alt="Result" />';
        statusEl.textContent = "Done.";
        statusEl.className = "";
      } catch (e) {
        statusEl.textContent = "Error: " + (e.message || String(e));
        statusEl.className = "error";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
